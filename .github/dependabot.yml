version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /hearth
    schedule:
      interval: weekly
    ignore:
      # newer sqlmodel rejects the naive datetimes every model stores (0.0.46 fails CI)
      - dependency-name: sqlmodel
        versions: [">0.0.42"]
    groups:
      python:
        patterns: ["*"]
  # Reflex owns these pins and re-writes them on every run, so only security
  # updates (limit 0 turns version updates off); a fix lands as an override.
  - package-ecosystem: bun
    directory: /hearth/reflex.lock
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  # Base images are pinned by digest; these keep the digests moving.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker_compose:
        patterns: ["*"]
