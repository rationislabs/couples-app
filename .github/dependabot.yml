version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /ledger_app
    schedule:
      interval: weekly
    ignore:
      # newer sqlmodel rejects the naive datetimes every model stores (0.0.46 fails CI)
      - dependency-name: sqlmodel
        versions: [">0.0.42"]
    groups:
      python:
        patterns: ["*"]
