name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: |
          uv venv ledger_app/.venv --python 3.12
          VIRTUAL_ENV=ledger_app/.venv uv pip install -r ledger_app/requirements.txt
          VIRTUAL_ENV=ledger_app/.venv uv pip install --no-deps -e ledger_app
      - run: tests/run.sh
      - run: uvx pip-audit -r ledger_app/requirements.txt

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/test_image.sh
