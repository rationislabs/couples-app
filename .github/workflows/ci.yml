name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: |
          uv venv hearth/.venv --python 3.12
          VIRTUAL_ENV=hearth/.venv uv pip install -r hearth/requirements.txt
          VIRTUAL_ENV=hearth/.venv uv pip install --no-deps -e hearth
      - run: tests/run.sh
      - run: uvx pip-audit==2.10.1 -r hearth/requirements.txt

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/test_image.sh
