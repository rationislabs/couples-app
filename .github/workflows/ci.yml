name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: |
          uv venv ledger_app/.venv --python 3.12
          VIRTUAL_ENV=ledger_app/.venv uv pip install -r ledger_app/requirements.txt
          VIRTUAL_ENV=ledger_app/.venv uv pip install --no-deps -e ledger_app
      - run: tests/run.sh
      - run: uvx pip-audit==2.10.1 -r ledger_app/requirements.txt

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/test_image.sh
