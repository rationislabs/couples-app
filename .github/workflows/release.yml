name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: |
          uv venv ledger_app/.venv --python 3.12
          VIRTUAL_ENV=ledger_app/.venv uv pip install -r ledger_app/requirements.txt
          VIRTUAL_ENV=ledger_app/.venv uv pip install --no-deps -e ledger_app
      - run: tests/run.sh

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # One build: the image that passes the smoke test is the image pushed.
      # The version comes from the tag name, so it reaches the shell through
      # env, never through ${{ }} inside the script.
      - run: |
          docker build --platform linux/amd64 \
            --build-arg LEDGER_VERSION="$VERSION" \
            -t "ghcr.io/rationislabs/couples-app:$VERSION" \
            -t ghcr.io/rationislabs/couples-app:latest .
        env:
          VERSION: ${{ steps.v.outputs.version }}
      - run: tests/test_image.sh
        env:
          IMAGE: ghcr.io/rationislabs/couples-app:${{ steps.v.outputs.version }}
          SKIP_BUILD: "1"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push --all-tags ghcr.io/rationislabs/couples-app
