name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv venv ledger_app/.venv --python 3.12
          VIRTUAL_ENV=ledger_app/.venv uv pip install -r ledger_app/requirements.txt
          VIRTUAL_ENV=ledger_app/.venv uv pip install --no-deps -e ledger_app
      - run: tests/run.sh

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # One build: the image that passes the smoke test is the image pushed.
      - run: |
          docker build --platform linux/amd64 \
            --build-arg LEDGER_VERSION=${{ steps.v.outputs.version }} \
            -t ghcr.io/rationislabs/couples-app:${{ steps.v.outputs.version }} \
            -t ghcr.io/rationislabs/couples-app:latest .
      - run: tests/test_image.sh
        env:
          IMAGE: ghcr.io/rationislabs/couples-app:${{ steps.v.outputs.version }}
          SKIP_BUILD: "1"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push --all-tags ghcr.io/rationislabs/couples-app
