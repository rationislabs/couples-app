# Test only. Publishes the app on the host loopback, port 3300, and skips
# Tailscale. compose.yml, the file users run, publishes nothing.
services:
  app:
    image: ${IMAGE:-hearth:test}
    environment:
      HEARTH_BIND_HOST: 0.0.0.0
      HEARTH_ALLOWED_HOST: hearth.example.ts.net
    # Runs as uid 10001 and never needs root powers: drop them all.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - data:/data
      - backups:/backups
volumes:
  data:
  backups:
