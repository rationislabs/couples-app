# Test only. Publishes the app on the host loopback, port 3300, and skips
# Tailscale. compose.yml, the file users run, publishes nothing.
services:
  app:
    image: ${IMAGE:-couples-app:test}
    environment:
      LEDGER_BIND_HOST: 0.0.0.0
      LEDGER_ALLOWED_HOST: couples.example.ts.net
      LEDGER_PUBLISHED_PORT: "3300"
    # Runs as uid 10001 and never needs root powers: drop them all.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - data:/data
      - backups:/backups
volumes:
  data:
  backups:
