# hearth. Copy .env.example to .env, paste a Tailscale auth key, then:
#   docker compose up -d
# and open https://hearth.<your-tailnet>.ts.net from any device on your tailnet.
#
# The app shares the tailscale container's network and publishes no port, so
# nothing off your tailnet can reach it — not even your own LAN. The app has
# no login; your tailnet is the login.
services:
  ts:
    image: tailscale/tailscale:stable@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    hostname: ${TS_HOSTNAME:-hearth}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-hearth}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
    restart: unless-stopped

  app:
    image: ghcr.io/rationislabs/hearth:${HEARTH_VERSION:-latest}
    network_mode: service:ts
    depends_on: [ts]
    environment:              # the app gets only the keys it uses; TS_AUTHKEY stays with ts
      - TMDB_API_KEY
      - TMDB_READ_TOKEN
      - SPOTIFY_CLIENT_ID
      - SPOTIFY_CLIENT_SECRET
      - SPOTIFY_REDIRECT_URI
      - SPOTIFY_REFRESH_TOKEN
      - LASTFM_API_KEY
      - TZ
      - HEARTH_ALLOWED_HOST=${HEARTH_ALLOWED_HOST:?set HEARTH_ALLOWED_HOST in .env to hearth.<your-tailnet>.ts.net}
      - HEARTH_BACKUP_AT
      - HEARTH_BACKUP_KEEP
    volumes:
      - data:/data
      - backups:/backups      # point this at a second disk or a synced folder
    restart: unless-stopped
    # Runs as uid 10001 and never needs root powers: drop them all.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

configs:
  ts-serve:
    content: |
      {"TCP": {"443": {"HTTPS": true}},
       "Web": {"$${TS_CERT_DOMAIN}:443": {"Handlers": {"/": {"Proxy": "http://127.0.0.1:3000"}}}}}

volumes:
  ts-state:
  data:
  backups:
