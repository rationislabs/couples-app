# Makes `import hearth` resolve from any working directory, so the scripts
# and tests do not each need sys.path.insert(). Installed editable into .venv:
#   VIRTUAL_ENV=$PWD/.venv uv pip install -e .
[project]
name = "hearth"
version = "0"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hearth"]
